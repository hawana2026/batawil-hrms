services:
  - type: web
    name: batawil-hrms-demo-67236
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_SSL
        value: require
      - key: DATABASE_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: TZ
        value: Asia/Aden
      - key: SESSION_IDLE_MINUTES
        value: "45"
      - key: SESSION_ABSOLUTE_HOURS
        value: "12"
      - key: SESSION_REMEMBER_DAYS
        value: "7"
